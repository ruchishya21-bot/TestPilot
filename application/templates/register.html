<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | TestPilot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">

<a href="/" class="auth-brand">
    <span class="brand-icon">T</span>
    TestPilot
</a>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-heading">
            <span class="eyebrow">GET STARTED</span>
            <h1>Create your account</h1>
            <p>Join the TestPilot demonstration portal.</p>
        </div>

        <form id="registerForm">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Choose a username" required>

            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="you@example.com" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Minimum 8 characters" required>

            <div id="registerMessage" class="message"></div>

            <button type="submit" class="primary-button full-button">
                Create Account →
            </button>
        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="/login">Sign in</a>
        </p>
    </div>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
