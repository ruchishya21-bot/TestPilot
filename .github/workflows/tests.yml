=name: TestPilot CI Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  automated-tests:

    runs-on: windows-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Report Directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports
          New-Item -ItemType Directory -Force screenshots

      - name: Start Application and Execute Tests
        shell: pwsh
        env:
          CI: "true"
          TESTPILOT_BASE_URL: "http://127.0.0.1:5000"

        run: |

          $process = $null
          $testExitCode = 1

          try {

            Write-Host "Starting TestPilot application..."

            $process = Start-Process `
              -FilePath python `
              -ArgumentList @(
                "-m",
                "flask",
                "--app",
                "application.app",
                "run",
                "--host",
                "127.0.0.1",
                "--port",
                "5000",
                "--no-reload"
              ) `
              -PassThru `
              -RedirectStandardOutput flask.log `
              -RedirectStandardError flask-error.log

            $healthy = $false

            for ($i = 0; $i -lt 30; $i++) {

              try {

                $response = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:5000/health" `
                  -TimeoutSec 3

                if ($response.StatusCode -eq 200) {

                  $healthy = $true
                  break

                }

              }
              catch {

                Start-Sleep -Seconds 2

              }

            }

            if (-not $healthy) {

              Get-Content flask-error.log -ErrorAction SilentlyContinue

              throw "TestPilot application failed to start."

            }

            Write-Host "TestPilot application is healthy."

            Write-Host "Executing automated tests with coverage..."

            pytest tests -n 2 `
              --cov=application `
              --cov-report=term-missing `
              --cov-report=html:reports/coverage `
              --cov-report=xml:reports/coverage.xml `
              --html=reports/report.html `
              --self-contained-html `
              --alluredir=reports/allure-results

            $testExitCode = $LASTEXITCODE

          }
          finally {

            if ($null -ne $process) {

              Write-Host "Stopping TestPilot application..."

              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue

            }

          }

          exit $testExitCode

      - name: Upload Test Reports and Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testpilot-test-reports-and-coverage
          path: |
            reports/
            screenshots/
            flask.log
            flask-error.log
          if-no-files-found: warn