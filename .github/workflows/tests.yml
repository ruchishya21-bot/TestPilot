name: TestPilot CI Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  automated-tests:

    runs-on: windows-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Report Directories
        run: |
          New-Item -ItemType Directory -Force reports
          New-Item -ItemType Directory -Force screenshots
        shell: pwsh

      - name: Start TestPilot Application
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath python `
            -ArgumentList "-c", "from application.app import app; app.run(host='127.0.0.1', port=5000)" `
            -PassThru `
            -RedirectStandardOutput flask.log `
            -RedirectStandardError flask-error.log

          $healthy = $false

          for ($i = 0; $i -lt 30; $i++) {
            try {
              $response = Invoke-WebRequest `
                -Uri "http://127.0.0.1:5000/health" `
                -TimeoutSec 3

              if ($response.StatusCode -eq 200) {
                $healthy = $true
                break
              }
            }
            catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $healthy) {
            Get-Content flask-error.log -ErrorAction SilentlyContinue
            throw "TestPilot application failed to start."
          }

          Write-Host "TestPilot application is healthy."

      - name: Execute Automated Tests
        env:
          CI: "true"
          TESTPILOT_BASE_URL: "http://127.0.0.1:5000"
        run: |
          pytest tests -n 2 `
            --html=reports/report.html `
            --self-contained-html `
            --alluredir=reports/allure-results

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testpilot-test-reports
          path: |
            reports/
            screenshots/
            flask.log
            flask-error.log
          if-no-files-found: warn